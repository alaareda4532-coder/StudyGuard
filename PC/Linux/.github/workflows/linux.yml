name: Build StudyGuard for Linux

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: PC/Linux

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test and build Linux release artifacts
        run: bash package/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StudyGuard-Linux-0.3.0
          path: PC/Linux/Release/0.3.0/*
          if-no-files-found: error
